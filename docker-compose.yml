# PostgreSQL and MinIO for local development.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: discvault
      POSTGRES_PASSWORD: discvault
      POSTGRES_DB: discvault
    ports:
      - '5432:5432'
    volumes:
      - discvault-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U discvault -d discvault']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - discvault-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/discvault;
      mc anonymous set download local/discvault;
      echo 'MinIO bucket discvault is ready'
      "

volumes:
  discvault-postgres:
  discvault-minio:
