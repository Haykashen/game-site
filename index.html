<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroKeep — Премиум-платформа для коллекционеров видеоигр</title>
    <script>
      // Applied before first paint so the stored theme never flashes.
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          document.documentElement.classList.toggle('dark', theme !== 'light');
        } catch (error) {
          /* localStorage can be unavailable (private mode) — keep the dark default. */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c0fa58'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23172013' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23172013'/%3E%3C/svg%3E"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
